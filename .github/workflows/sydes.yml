name: Sydes

on:
  pull_request:
    branches: [ "sydes-test-base" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  sydes:
    uses: sydes-examples/.github/.github/workflows/sydes-verify.yml@main
    with:
      repo_alias: app
      sydes_ref: 0.2.0b22
      model: openai:gpt-5.1
      recovery_route_context: true
      recovery_graph_path_search: true
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
