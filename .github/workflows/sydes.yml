# .github/workflows/sydes.yml — added ONCE, via one normal PR to main
name: Sydes

on:
  pull_request:
    branches: [ "sydes-test-base-9574" ]        # your team's actual default/target branches

permissions:
  contents: read
  pull-requests: write

jobs:
  sydes:
    uses: sydes-examples/.github/.github/workflows/sydes-verify.yml@main
    with:
      repo_alias: app
      model: openai:gpt-5.1        # <-- add this, matches every other repo
      recovery_route_context: true
      recovery_graph_path_search: true
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
